name: bootstrap-register-prelude

on:
  push:
  pull_request:

jobs:
  synthetic-bootstrap-prelude:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify WiiCompiled pin
        run: test "$(git -C third_party/WiiCompiled rev-parse HEAD)" = "a135beb201042b20f390c6695ca6b26768820fb4"

      - name: Validate guarded local helper and reporting boundary
        run: |
          bash -n scripts/build-local-bootstrap-prelude.sh
          grep -Fq 'BOOTSTRAP_SYMBOL="func_80006210"' scripts/build-local-bootstrap-prelude.sh
          grep -Fq 'MKW_LOCAL_BOOTSTRAP_PRELUDE=1' scripts/build-local-bootstrap-prelude.sh
          grep -Fq 'TRANSLATED_BOOTSTRAP_PRELUDE_EXECUTED' source/runtime_bootstrap.cpp
          grep -Fq 'translated bootstrap mode' source/runtime_bootstrap.cpp
          grep -Fq 'func_80006210' local-execution-support/local_first_translated_execution.cpp

      - name: Locate AArch64 nm
        run: |
          NM_TOOL="$(find "$DEVKITPRO" -type f -name 'aarch64-none-elf-nm' -print -quit)"
          test -n "$NM_TOOL"
          test -x "$NM_TOOL"
          echo "NM_TOOL=$NM_TOOL" >> "$GITHUB_ENV"

      - name: Build Nintendo-data-free bootstrap register prelude
        run: |
          make -j2 \
            MKW_SYNTHETIC_EXECUTION=1 \
            MKW_SYNTHETIC_BOOTSTRAP_PRELUDE=1 \
            TARGET=WiiCompiled-Switch-synthetic-bootstrap-prelude \
            BUILD=build-synthetic-bootstrap-prelude \
            APP_VERSION=0.0.8-synthetic-bootstrap-prelude \
            TRANSLATED_RETAIN_SYMBOL=synthetic_translated_bootstrap_registers \
            DEFINES='-DMKW_SYNTHETIC_EXECUTION=1 -DMKW_SYNTHETIC_BOOTSTRAP_PRELUDE=1 -DMKW_ENABLE_DATA_INIT_HANDOFF=1 -DMKW_ENABLE_TRANSLATED_EXECUTION_HANDOFF=1'

      - name: Verify bootstrap execution seam and retained synthetic helper
        run: |
          test -f WiiCompiled-Switch-synthetic-bootstrap-prelude.nro
          test -f WiiCompiled-Switch-synthetic-bootstrap-prelude.elf
          "$NM_TOOL" WiiCompiled-Switch-synthetic-bootstrap-prelude.elf > /tmp/bootstrap-prelude.nm
          grep -E ' T mkw_switch_get_translated_product_api$' /tmp/bootstrap-prelude.nm
          grep -E ' T mkw_switch_get_translated_product_handoff_api$' /tmp/bootstrap-prelude.nm
          grep -E ' T mkw_switch_get_translated_execution_handoff_api$' /tmp/bootstrap-prelude.nm
          grep -E ' T synthetic_translated_bootstrap_registers$' /tmp/bootstrap-prelude.nm

      - uses: actions/upload-artifact@v4
        with:
          name: WiiCompiled-Switch-synthetic-bootstrap-prelude-nro
          path: WiiCompiled-Switch-synthetic-bootstrap-prelude.nro
