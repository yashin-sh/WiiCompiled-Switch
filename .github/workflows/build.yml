name: build-switch

on:
  push:
  pull_request:

jobs:
  nro:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify WiiCompiled pin
        run: test "$(git -C third_party/WiiCompiled rev-parse HEAD)" = "a135beb201042b20f390c6695ca6b26768820fb4"

      - name: Validate local-only helper scripts
        run: |
          bash -n scripts/prepare-local-data-init.sh
          bash -n scripts/prepare-local-function-shards.sh
          bash -n scripts/build-local-function-link.sh
          python3 -m py_compile scripts/normalize-gcc-statefree-returns.py
          grep -Fq 'a135beb201042b20f390c6695ca6b26768820fb4' scripts/prepare-local-function-shards.sh
          grep -Fq 'ENTRY="0x800060A4"' scripts/prepare-local-function-shards.sh
          grep -Fq -- '--output-metadata "$METADATA"' scripts/prepare-local-function-shards.sh
          grep -Fq -- '--base-metadata "$METADATA"' scripts/prepare-local-function-shards.sh
          grep -Fq -- '--base-functions-dir "$FUNCTIONS"' scripts/prepare-local-function-shards.sh
          grep -Fq -- '--native-source-dir "$NATIVE_SOURCES"' scripts/prepare-local-function-shards.sh
          grep -Fq -- '--out "$SHARD_ROOT"' scripts/prepare-local-function-shards.sh
          grep -Fq 'TRANSLATED_RETAIN_SYMBOL := func_8000609C' Makefile
          ! grep -Fq 'TRANSLATED_RETAIN_SYMBOL := __get_debug_bba' Makefile
          grep -Fq 'PASS: final ELF contains T $RETAIN_SYMBOL' scripts/build-local-function-link.sh

      - name: Locate AArch64 tools
        run: |
          NM_TOOL="$(find "$DEVKITPRO" -type f -name 'aarch64-none-elf-nm' -print -quit)"
          CXX_TOOL="$(find "$DEVKITPRO" -type f -name 'aarch64-none-elf-g++' -print -quit)"
          test -n "$NM_TOOL"
          test -x "$NM_TOOL"
          test -n "$CXX_TOOL"
          test -x "$CXX_TOOL"
          echo "NM_TOOL=$NM_TOOL" >> "$GITHUB_ENV"
          echo "CXX_TOOL=$CXX_TOOL" >> "$GITHUB_ENV"

      - name: Verify GCC state-free return normalization
        run: |
          cat > /tmp/statefree-return-probe.cpp <<'EOF'
          #include <cstdint>
          #include "devkita64_gcc_compat.hpp"
          #define MKW_PPC_NO_INLINE __attribute__((noinline))
          using MkwStateFreeResult2 = std::uint64_t __attribute__((ext_vector_type(2)));
          extern "C" MKW_PPC_NO_INLINE MkwStateFreeResult2 synthetic_statefree_return(
              std::uint64_t a, std::uint64_t b)
          {
              if (a == 0) {
                  return { b, a };
              }
              return { a, b };
          }
          EOF
          python3 scripts/normalize-gcc-statefree-returns.py /tmp/statefree-return-probe.cpp
          grep -Fq 'return MkwStateFreeResult2{ b, a };' /tmp/statefree-return-probe.cpp
          grep -Fq 'return MkwStateFreeResult2{ a, b };' /tmp/statefree-return-probe.cpp
          "$CXX_TOOL" -std=gnu++20 -Iinclude -c /tmp/statefree-return-probe.cpp -o /tmp/statefree-return-probe.o

      - name: Build Nintendo-data-free NRO
        run: make -j2
      - name: Verify default weak seams
        run: |
          test -f WiiCompiled-Switch.nro
          test -f WiiCompiled-Switch.elf
          "$NM_TOOL" WiiCompiled-Switch.elf | grep -E ' W mkw_switch_get_translated_product_api$'
          "$NM_TOOL" WiiCompiled-Switch.elf | grep -E ' W mkw_switch_get_translated_product_handoff_api$'
      - uses: actions/upload-artifact@v4
        with:
          name: WiiCompiled-Switch-nro
          path: WiiCompiled-Switch.nro

      - name: Build synthetic strong-product probe
        run: make -j2 MKW_SYNTHETIC_PRODUCT=1
      - name: Verify metadata-only synthetic seam
        run: |
          test -f WiiCompiled-Switch-synthetic-product.nro
          test -f WiiCompiled-Switch-synthetic-product.elf
          "$NM_TOOL" WiiCompiled-Switch-synthetic-product.elf | grep -E ' T mkw_switch_get_translated_product_api$'
          "$NM_TOOL" WiiCompiled-Switch-synthetic-product.elf | grep -E ' W mkw_switch_get_translated_product_handoff_api$'
      - uses: actions/upload-artifact@v4
        with:
          name: WiiCompiled-Switch-synthetic-product-nro
          path: WiiCompiled-Switch-synthetic-product.nro

      - name: Build synthetic data-init handoff probe
        run: make -j2 MKW_SYNTHETIC_DATA_INIT=1
      - name: Verify executable synthetic handoff seams
        run: |
          test -f WiiCompiled-Switch-synthetic-data-init.nro
          test -f WiiCompiled-Switch-synthetic-data-init.elf
          "$NM_TOOL" WiiCompiled-Switch-synthetic-data-init.elf | grep -E ' T mkw_switch_get_translated_product_api$'
          "$NM_TOOL" WiiCompiled-Switch-synthetic-data-init.elf | grep -E ' T mkw_switch_get_translated_product_handoff_api$'
      - uses: actions/upload-artifact@v4
        with:
          name: WiiCompiled-Switch-synthetic-data-init-nro
          path: WiiCompiled-Switch-synthetic-data-init.nro

      - name: Build synthetic translated-function link probe
        run: make -j2 MKW_SYNTHETIC_FUNCTION_LINK=1
      - name: Verify devkitA64 translated-function seam
        run: |
          test -f WiiCompiled-Switch-synthetic-function-link.nro
          test -f WiiCompiled-Switch-synthetic-function-link.elf
          "$NM_TOOL" WiiCompiled-Switch-synthetic-function-link.elf | grep -E ' T synthetic_translated_leaf$'
          "$NM_TOOL" WiiCompiled-Switch-synthetic-function-link.elf | grep -E ' T GX_HLE_FIFO_Write8$'
      - uses: actions/upload-artifact@v4
        with:
          name: WiiCompiled-Switch-synthetic-function-link-nro
          path: WiiCompiled-Switch-synthetic-function-link.nro
