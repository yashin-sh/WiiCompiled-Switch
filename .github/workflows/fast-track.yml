      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: WiiCompiled-Switch-synthetic-fast-track-nro
          path: WiiCompiled-Switch-synthetic-fast-track.nro
