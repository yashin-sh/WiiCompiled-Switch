          grep -E ' T synthetic_kpad_unified_status_hle_probe$' /tmp/fast-track.nm
          grep -E ' T mkw_switch_hle_kpad_unified_status$' /tmp/fast-track.nm
          grep -E ' T synthetic_pad_control_motor_hle_probe$' /tmp/fast-track.nm
          grep -E ' T mkw_switch_hle_pad_control_motor$' /tmp/fast-track.nm
          grep -E ' T synthetic_pad_reset_hle_probe$' /tmp/fast-track.nm
          grep -E ' T mkw_switch_hle_pad_reset$' /tmp/fast-track.nm
          grep -E ' T mkw_switch_hle_gx_set_fog$' /tmp/fast-track.nm
          grep -E ' T mkw_switch_hle_gx_set_z_comp_loc$' /tmp/fast-track.nm
          grep -E ' T synthetic_translated_fast_track_start$' /tmp/fast-track.nm
          grep -E ' T synthetic_translated_fast_track_stage2$' /tmp/fast-track.nm
          grep -E ' T synthetic_translated_fast_track_stage3$' /tmp/fast-track.nm
          grep -E ' T PPC_Mftb$' /tmp/fast-track.nm
          grep -E ' T PPC_Mftbu$' /tmp/fast-track.nm
          grep -E ' T PPC_ReadSpr$' /tmp/fast-track.nm
          grep -E ' T PPC_WriteSpr$' /tmp/fast-track.nm
          grep -E ' T mkw_switch_hle_os_get_system_time$' /tmp/fast-track.nm
