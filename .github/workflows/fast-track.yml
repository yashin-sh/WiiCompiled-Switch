name: fast-track-startup

on:
  push:
  pull_request:

jobs:
  synthetic-fast-track:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify WiiCompiled pin
        run: test "$(git -C third_party/WiiCompiled rev-parse HEAD)" = "a135beb201042b20f390c6695ca6b26768820fb4"

      - name: Validate fast-track helper and crash diagnostics
        run: |
          bash -n scripts/build-local-fast-track.sh
          grep -Fq 'START_SYMBOL="func_800060A4"' scripts/build-local-fast-track.sh
          grep -Fq 'MKW_LOCAL_FAST_TRACK=1' scripts/build-local-fast-track.sh
          grep -Fq 'fast-track-progress.txt' scripts/build-local-fast-track.sh
          grep -Fq 'func_800060A4' local-execution-support/local_first_translated_execution.cpp
          grep -Fq 'BLOCKED_STD_EXCEPTION' local-execution-support/local_first_translated_execution.cpp
          grep -Fq 'fast-track-dispatch-blocker.txt' source/fast_track_crash_diagnostics.cpp
          grep -Fq 'fast-track-exception.txt' source/fast_track_crash_diagnostics.cpp
          grep -Fq '__libnx_exception_handler' source/fast_track_crash_diagnostics.cpp
          grep -Fq 'if constexpr (KnownTranslatedCpuCall<Target>::kAvailable)' include/abi_bridge.h
          grep -Fq 'DispatchKnownTranslatedCpuTargetStatic<Target>(cpu)' include/abi_bridge.h
          grep -Fq 'KnownNativeCpuCall<0x801AAD7Cu>' include/abi_bridge.h
          grep -Fq 'KnownNativeCpuCall<0x801A65ACu>' include/abi_bridge.h
          grep -Fq 'KnownNativeCpuCall<0x801A65C0u>' include/abi_bridge.h
          grep -Fq 'KnownNativeCpuCall<0x801A65D4u>' include/abi_bridge.h
          grep -Fq 'KnownNativeCpuCall<0x801A00E0u>' include/abi_bridge.h
          grep -Fq 'KnownNativeCpuCall<0x801A661Cu>' include/abi_bridge.h
          grep -Fq 'MKW_NATIVE_NOOP_TRAIT(8012E5B8)' include/abi_bridge.h
          grep -Fq 'MKW_NATIVE_NOOP_TRAIT(8012E5C0)' include/abi_bridge.h
          grep -Fq 'MKW_NATIVE_NOOP_TRAIT(8012E5C8)' include/abi_bridge.h
          grep -Fq 'MKW_NATIVE_NOOP_TRAIT(8012E5D0)' include/abi_bridge.h
          grep -Fq 'MKW_NATIVE_NOOP_TRAIT(8012E5D8)' include/abi_bridge.h
          grep -Fq 'MKW_NATIVE_NOOP_TRAIT(8012E5E0)' include/abi_bridge.h
          grep -Fq 'MKW_NATIVE_NOOP_TRAIT(8012E640)' include/abi_bridge.h
          grep -Fq 'MKW_NATIVE_NOOP_TRAIT(8012E64C)' include/abi_bridge.h
          grep -Fq 'MKW_NATIVE_NOOP_TRAIT(8012E654)' include/abi_bridge.h
          grep -Fq 'MKW_NATIVE_NOOP_TRAIT(8012E684)' include/abi_bridge.h
          grep -Fq 'mkw_switch_hle_os_get_system_time(cpu)' include/abi_bridge.h
          grep -Fq 'mkw_switch_hle_os_disable_interrupts(cpu)' include/abi_bridge.h
          grep -Fq 'mkw_switch_hle_os_enable_interrupts(cpu)' include/abi_bridge.h
          grep -Fq 'mkw_switch_hle_os_restore_interrupts(cpu)' include/abi_bridge.h
          grep -Fq 'mkw_switch_hle_os_exception_init(cpu)' include/abi_bridge.h
          grep -Fq 'mkw_switch_hle_os_interrupt_init(cpu)' include/abi_bridge.h
          grep -Fq 'InvokeDirectCpu<0x7F0001A0u>(ctx)' synthetic-execution/synthetic_execution_probe.cpp
          grep -Fq 'InvokeDirectCpu<0x7F0001C0u>(ctx)' synthetic-execution/synthetic_execution_probe.cpp
          grep -Fq 'TimeBaseContract::NanosecondsToTicks' source/ppc_runtime_helpers_bridge.cpp
          grep -Fq 'PPC_ReadSpr(std::uint32_t spr)' source/ppc_runtime_helpers_bridge.cpp
          grep -Fq 'PPC_WriteSpr(std::uint32_t spr, std::uint32_t value)' source/ppc_runtime_helpers_bridge.cpp
          grep -Fq 'mkw_switch_hle_os_get_system_time(CpuContext* cpu)' source/ppc_runtime_helpers_bridge.cpp
          grep -Fq 'mkw_switch_hle_os_disable_interrupts(CpuContext* cpu)' source/ppc_runtime_helpers_bridge.cpp
          grep -Fq 'mkw_switch_hle_os_enable_interrupts(CpuContext* cpu)' source/ppc_runtime_helpers_bridge.cpp
          grep -Fq 'mkw_switch_hle_os_restore_interrupts(CpuContext* cpu)' source/ppc_runtime_helpers_bridge.cpp
          grep -Fq 'mkw_switch_hle_os_exception_init(CpuContext* cpu)' source/ppc_runtime_helpers_bridge.cpp
          grep -Fq 'mkw_switch_hle_os_interrupt_init(CpuContext* cpu)' source/ppc_runtime_helpers_bridge.cpp
          grep -Fq 'Memory::Write32(kInterruptHandlerTablePtrAddr, kInterruptHandlerTableAddr)' source/ppc_runtime_helpers_bridge.cpp
          grep -Fq 'Memory::Read32(kSystemTimeBaseHi)' source/ppc_runtime_helpers_bridge.cpp
          grep -Fq 'PPC_Mftb()' synthetic-execution/ppc_helper_link_probe.cpp
          grep -Fq 'PPC_Mftbu()' synthetic-execution/ppc_helper_link_probe.cpp
          grep -Fq 'PPC_ReadSpr(9u)' synthetic-execution/ppc_helper_link_probe.cpp
          grep -Fq 'PPC_WriteSpr(9u, ctr)' synthetic-execution/ppc_helper_link_probe.cpp
          grep -Fq 'InvokeDirectCpu<0x801AAD7Cu>(ctx)' synthetic-execution/ppc_helper_link_probe.cpp
          grep -Fq 'InvokeDirectCpu<0x801A65ACu>(ctx)' synthetic-execution/ppc_helper_link_probe.cpp
          grep -Fq 'InvokeDirectCpu<0x801A65C0u>(ctx)' synthetic-execution/ppc_helper_link_probe.cpp
          grep -Fq 'InvokeDirectCpu<0x801A65D4u>(ctx)' synthetic-execution/ppc_helper_link_probe.cpp
          grep -Fq 'InvokeDirectCpu<0x801A00E0u>(ctx)' synthetic-execution/ppc_helper_link_probe.cpp
          grep -Fq 'InvokeDirectCpu<0x801A661Cu>(ctx)' synthetic-execution/ppc_helper_link_probe.cpp
          grep -Fq 'InvokeDirectCpu<0x8012E5B8u>(ctx)' synthetic-execution/ppc_helper_link_probe.cpp
          grep -Fq 'InvokeDirectCpu<0x8012E5C0u>(ctx)' synthetic-execution/ppc_helper_link_probe.cpp
          grep -Fq 'InvokeDirectCpu<0x8012E5C8u>(ctx)' synthetic-execution/ppc_helper_link_probe.cpp
          grep -Fq 'InvokeDirectCpu<0x8012E5D0u>(ctx)' synthetic-execution/ppc_helper_link_probe.cpp
          grep -Fq 'InvokeDirectCpu<0x8012E5D8u>(ctx)' synthetic-execution/ppc_helper_link_probe.cpp
          grep -Fq 'InvokeDirectCpu<0x8012E5E0u>(ctx)' synthetic-execution/ppc_helper_link_probe.cpp
          grep -Fq 'InvokeDirectCpu<0x8012E640u>(ctx)' synthetic-execution/ppc_helper_link_probe.cpp
          grep -Fq 'InvokeDirectCpu<0x8012E64Cu>(ctx)' synthetic-execution/ppc_helper_link_probe.cpp
          grep -Fq 'InvokeDirectCpu<0x8012E654u>(ctx)' synthetic-execution/ppc_helper_link_probe.cpp
          grep -Fq 'InvokeDirectCpu<0x8012E684u>(ctx)' synthetic-execution/ppc_helper_link_probe.cpp

      - name: Locate AArch64 nm
        run: |
          NM_TOOL="$(find "$DEVKITPRO" -type f -name 'aarch64-none-elf-nm' -print -quit)"
          test -n "$NM_TOOL"
          test -x "$NM_TOOL"
          echo "NM_TOOL=$NM_TOOL" >> "$GITHUB_ENV"

      - name: Build Nintendo-data-free fast-track control probe
        run: |
          make -j2 \
            MKW_SYNTHETIC_EXECUTION=1 \
            MKW_SYNTHETIC_FAST_TRACK=1 \
            TARGET=WiiCompiled-Switch-synthetic-fast-track \
            BUILD=build-synthetic-fast-track \
            APP_VERSION=0.0.17-synthetic-fast-track-os-init-hle \
            TRANSLATED_RETAIN_SYMBOL=synthetic_ppc_helper_link_probe \
            DEFINES='-DMKW_SYNTHETIC_EXECUTION=1 -DMKW_SYNTHETIC_FAST_TRACK=1 -DMKW_ENABLE_DATA_INIT_HANDOFF=1 -DMKW_ENABLE_TRANSLATED_EXECUTION_HANDOFF=1'

      - name: Verify fast-track execution seam and PPC runtime helpers
        run: |
          test -f WiiCompiled-Switch-synthetic-fast-track.nro
          test -f WiiCompiled-Switch-synthetic-fast-track.elf
          "$NM_TOOL" WiiCompiled-Switch-synthetic-fast-track.elf > /tmp/fast-track.nm
          grep -E ' T mkw_switch_get_translated_product_api$' /tmp/fast-track.nm
          grep -E ' T mkw_switch_get_translated_product_handoff_api$' /tmp/fast-track.nm
          grep -E ' T mkw_switch_get_translated_execution_handoff_api$' /tmp/fast-track.nm
          grep -E ' T synthetic_ppc_helper_link_probe$' /tmp/fast-track.nm
          grep -E ' T synthetic_translated_fast_track_start$' /tmp/fast-track.nm
          grep -E ' T synthetic_translated_fast_track_stage2$' /tmp/fast-track.nm
          grep -E ' T synthetic_translated_fast_track_stage3$' /tmp/fast-track.nm
          grep -E ' T PPC_Mftb$' /tmp/fast-track.nm
          grep -E ' T PPC_Mftbu$' /tmp/fast-track.nm
          grep -E ' T PPC_ReadSpr$' /tmp/fast-track.nm
          grep -E ' T PPC_WriteSpr$' /tmp/fast-track.nm
          grep -E ' T mkw_switch_hle_os_get_system_time$' /tmp/fast-track.nm
          grep -E ' T mkw_switch_hle_os_disable_interrupts$' /tmp/fast-track.nm
          grep -E ' T mkw_switch_hle_os_enable_interrupts$' /tmp/fast-track.nm
          grep -E ' T mkw_switch_hle_os_restore_interrupts$' /tmp/fast-track.nm
          grep -E ' T mkw_switch_hle_os_exception_init$' /tmp/fast-track.nm
          grep -E ' T mkw_switch_hle_os_interrupt_init$' /tmp/fast-track.nm
          grep -E ' T mkw_switch_report_unsupported_translated_dispatch$' /tmp/fast-track.nm
          grep -E ' T __libnx_exception_handler$' /tmp/fast-track.nm

      - uses: actions/upload-artifact@v4
        with:
          name: WiiCompiled-Switch-synthetic-fast-track-nro
          path: WiiCompiled-Switch-synthetic-fast-track.nro
