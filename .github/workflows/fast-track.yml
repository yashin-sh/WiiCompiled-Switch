          grep -E ' T mkw_switch_hle_gx_set_copy_clamp$' /tmp/fast-track.nm
          grep -E ' T mkw_switch_hle_gx_set_tex_copy_src$' /tmp/fast-track.nm
          grep -E ' T mkw_switch_hle_gx_set_tex_copy_dst$' /tmp/fast-track.nm
          grep -E ' T synthetic_gx_display_list_hle_probe$' /tmp/fast-track.nm
          grep -E ' T mkw_switch_hle_gx_begin_display_list$' /tmp/fast-track.nm
          grep -E ' T mkw_switch_hle_gx_end_display_list$' /tmp/fast-track.nm
