name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}-${{ github.ref_type }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install lint tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck clang-format python3-venv

          python3 -m venv /tmp/wc-lint-venv
          /tmp/wc-lint-venv/bin/pip install --disable-pip-version-check ruff==0.16.7
          echo "/tmp/wc-lint-venv/bin" >> "$GITHUB_PATH"

          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/wc-actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            /tmp/wc-actionlint.tar.gz | sha256sum --check --strict -
          tar -xz -f /tmp/wc-actionlint.tar.gz -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Bash syntax
        run: |
          set -euo pipefail
          mapfile -d '' scripts < <(find scripts -type f -name '*.sh' -print0)
          if ((${#scripts[@]} == 0)); then
            echo "No shell scripts found"
            exit 0
          fi
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done

      - name: ShellCheck
        run: |
          set -euo pipefail
          mapfile -d '' scripts < <(find scripts -type f -name '*.sh' -print0)
          if ((${#scripts[@]} == 0)); then
            echo "No shell scripts found"
            exit 0
          fi
          shellcheck --severity=warning "${scripts[@]}"

      - name: GitHub Actions lint
        run: |
          set -euo pipefail
          cat > /tmp/actionlint-shellcheck <<'EOF'
          #!/usr/bin/env bash
          exec shellcheck --severity=warning "$@"
          EOF
          chmod +x /tmp/actionlint-shellcheck
          actionlint -color -shellcheck=/tmp/actionlint-shellcheck

      - name: Python lint and format
        run: |
          set -euo pipefail
          mapfile -t python_files < <(git ls-files 'scripts/*.py')
          if ((${#python_files[@]} == 0)); then
            echo "No Python scripts found"
            exit 0
          fi
          ruff check "${python_files[@]}"
          ruff format --check "${python_files[@]}"

      - name: RMCP01 address attribution self-test
        run: |
          set -euo pipefail
          python3 scripts/attribute-rmcp01-address.py --self-test

      - name: RMCP01 frontier forecast self-test
        run: |
          set -euo pipefail
          python3 scripts/forecast-rmcp01-frontier.py --self-test

      - name: RMCP01 local dispatch coverage scanner self-test
        run: |
          set -euo pipefail
          python3 scripts/scan-local-rmcp01-dispatch-coverage.py --self-test

      - name: RMCP01 GX texture callsite scanner self-test
        run: |
          set -euo pipefail
          python3 scripts/scan-rmcp01-gx-texture-calls.py --self-test

      - name: Fast-track log bundler self-test
        run: |
          set -euo pipefail
          python3 scripts/package-fast-track-run.py --self-test

      - name: C and C++ format for changed first-party lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ ]]; then
            DEFAULT_BASE="refs/remotes/origin/${DEFAULT_BRANCH:-}"
            if [[ -n "${DEFAULT_BRANCH:-}" && "${GITHUB_REF:-}" != "refs/heads/$DEFAULT_BRANCH" ]] &&
              git cat-file -e "${DEFAULT_BASE}^{commit}" 2>/dev/null; then
              BASE_SHA="$DEFAULT_BASE"
            else
              BASE_SHA="$(git rev-list --max-parents=0 HEAD | tail -n1)"
            fi
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          DIFF_BASE="$(git merge-base "$BASE_SHA" HEAD)"

          mapfile -t cpp_files < <(
            git diff --name-only --diff-filter=ACMRT "$DIFF_BASE" HEAD -- \
              '*.c' '*.cc' '*.cpp' '*.h' '*.hh' '*.hpp' \
              ':(exclude)third_party/**' \
              ':(exclude)local-product/generated/**'
          )

          if ((${#cpp_files[@]} == 0)); then
            echo "No changed first-party C/C++ files to format-check"
            exit 0
          fi

          failed=0
          for file in "${cpp_files[@]}"; do
            ranges=()
            while IFS= read -r hunk; do
              if [[ "$hunk" =~ ^@@\ -[0-9]+(,[0-9]+)?\ \+([0-9]+)(,([0-9]+))?\ @@ ]]; then
                start="${BASH_REMATCH[2]}"
                count="${BASH_REMATCH[4]:-1}"
                if ((count > 0)); then
                  end=$((start + count - 1))
                  ranges+=("--lines=${start}:${end}")
                fi
              fi
            done < <(git diff -U0 --no-color "$DIFF_BASE" HEAD -- "$file" | grep '^@@' || true)

            if ((${#ranges[@]} == 0)); then
              continue
            fi

            echo "clang-format checking changed lines in $file: ${ranges[*]}"
            if ! clang-format --dry-run --Werror --style=file "${ranges[@]}" "$file"; then
              failed=1
            fi
          done

          if ((failed != 0)); then
            echo "Changed first-party C/C++ lines are not clang-formatted" >&2
            exit 1
          fi

          echo "Changed first-party C/C++ lines are clang-formatted"
