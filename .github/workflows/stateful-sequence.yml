name: stateful-translated-sequence

on:
  push:
  pull_request:

jobs:
  synthetic-sequence:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify WiiCompiled pin
        run: test "$(git -C third_party/WiiCompiled rev-parse HEAD)" = "a135beb201042b20f390c6695ca6b26768820fb4"

      - name: Validate local sequence helper
        run: |
          bash -n scripts/build-local-stateful-sequence.sh
          grep -Fq 'MKW_LOCAL_FUNCTION_SEQUENCE=1' scripts/build-local-stateful-sequence.sh
          grep -Fq 'SETTER_SYMBOL="func_80006090"' scripts/build-local-stateful-sequence.sh
          grep -Fq 'GETTER_SYMBOL="func_8000609C"' scripts/build-local-stateful-sequence.sh
          grep -Fq 'after=0x00000001' scripts/build-local-stateful-sequence.sh

      - name: Locate AArch64 nm
        run: |
          NM_TOOL="$(find "$DEVKITPRO" -type f -name 'aarch64-none-elf-nm' -print -quit)"
          test -n "$NM_TOOL"
          test -x "$NM_TOOL"
          echo "NM_TOOL=$NM_TOOL" >> "$GITHUB_ENV"

      - name: Build Nintendo-data-free stateful sequence probe
        run: |
          make -j2 \
            MKW_SYNTHETIC_EXECUTION=1 \
            MKW_SYNTHETIC_SEQUENCE=1 \
            TARGET=WiiCompiled-Switch-synthetic-sequence \
            BUILD=build-synthetic-sequence \
            APP_VERSION=0.0.7-synthetic-sequence \
            TRANSLATED_RETAIN_SYMBOL=synthetic_translated_sequence_set \
            DEFINES='-DMKW_SYNTHETIC_EXECUTION=1 -DMKW_SYNTHETIC_SEQUENCE=1 -DMKW_ENABLE_DATA_INIT_HANDOFF=1 -DMKW_ENABLE_TRANSLATED_EXECUTION_HANDOFF=1'

      - name: Verify two-step execution seam and retained functions
        run: |
          test -f WiiCompiled-Switch-synthetic-sequence.nro
          test -f WiiCompiled-Switch-synthetic-sequence.elf
          "$NM_TOOL" WiiCompiled-Switch-synthetic-sequence.elf > /tmp/sequence.nm
          grep -E ' T mkw_switch_get_translated_product_api$' /tmp/sequence.nm
          grep -E ' T mkw_switch_get_translated_product_handoff_api$' /tmp/sequence.nm
          grep -E ' T mkw_switch_get_translated_execution_handoff_api$' /tmp/sequence.nm
          grep -E ' T synthetic_translated_sequence_set$' /tmp/sequence.nm
          grep -E ' T synthetic_translated_sequence_get$' /tmp/sequence.nm

      - uses: actions/upload-artifact@v4
        with:
          name: WiiCompiled-Switch-synthetic-sequence-nro
          path: WiiCompiled-Switch-synthetic-sequence.nro
